<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Рейтинг Рекрутов</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:       #050508;
    --surface:  #0d0d14;
    --card:     #11111a;
    --border:   #1e1e2e;
    --red:      #e63946;
    --gold:     #e9c46a;
    --amber:    #f4a261;
    --green:    #2ec27e;
    --muted:    #555570;
    --text:     #d8d8e8;
    --dim:      #888899;
    --white:    #f0f0fa;
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Background grid ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(230,57,70,.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(230,57,70,.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  .wrap { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 20px 60px; }

  /* ── Header ── */
  header {
    padding: 50px 0 40px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 20px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
    margin-bottom: 40px;
    animation: fadeDown .6s ease both;
  }

  .logo { display: flex; align-items: flex-end; gap: 16px; }

  .logo-icon {
    width: 56px; height: 56px;
    background: var(--red);
    display: grid; place-items: center;
    font-size: 28px;
    clip-path: polygon(0 0, calc(100% - 12px) 0, 100% 12px, 100% 100%, 12px 100%, 0 calc(100% - 12px));
  }

  h1 {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(32px, 6vw, 52px);
    letter-spacing: 3px;
    line-height: 1;
    color: var(--white);
  }

  h1 span { color: var(--red); }

  .meta {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 1px;
    text-transform: uppercase;
    display: flex; flex-direction: column; gap: 4px; text-align: right;
  }

  .meta strong { color: var(--muted); }

  /* ── Filters ── */
  .toolbar {
    display: flex; gap: 10px; flex-wrap: wrap;
    margin-bottom: 24px;
    animation: fadeUp .5s .2s ease both;
  }

  .filter-btn {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--dim);
    font-family: 'Rajdhani', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 1px;
    padding: 7px 18px;
    cursor: pointer;
    transition: .2s;
    clip-path: polygon(0 0, calc(100% - 8px) 0, 100% 8px, 100% 100%, 8px 100%, 0 calc(100% - 8px));
  }

  .filter-btn:hover, .filter-btn.active {
    background: var(--red);
    border-color: var(--red);
    color: #fff;
  }

  .spacer { flex: 1; }

  .update-info {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    align-self: center;
  }

  /* ── Table ── */
  .table-wrap {
    animation: fadeUp .5s .3s ease both;
  }

  table {
    width: 100%;
    border-collapse: collapse;
  }

  thead tr {
    border-bottom: 1px solid var(--red);
  }

  th {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 12px 16px;
    text-align: left;
    cursor: pointer;
    white-space: nowrap;
    user-select: none;
  }

  th:hover { color: var(--red); }
  th.sorted { color: var(--red); }
  th.sorted::after { content: ' ↓'; }
  th.sorted.asc::after { content: ' ↑'; }

  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .15s;
    animation: fadeRow .4s ease both;
  }

  tbody tr:hover { background: rgba(230,57,70,.04); }

  td {
    padding: 16px 16px;
    vertical-align: middle;
    font-size: 15px;
    font-weight: 500;
  }

  /* ── Position cell ── */
  .pos {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 13px;
    color: var(--muted);
    width: 44px;
  }

  .pos-1, .pos-2, .pos-3 { font-size: 18px; }
  .pos-1 { color: var(--gold); }
  .pos-2 { color: #aaa; }
  .pos-3 { color: var(--amber); }

  /* ── Name cell ── */
  .recruiter-name {
    display: flex; align-items: center; gap: 12px;
  }

  .avatar {
    width: 38px; height: 38px;
    background: var(--surface);
    border: 1px solid var(--border);
    display: grid; place-items: center;
    font-size: 15px;
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 500;
    color: var(--dim);
    flex-shrink: 0;
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
  }

  .name-block { display: flex; flex-direction: column; gap: 2px; }
  .display-name { color: var(--white); font-weight: 700; font-size: 15px; }
  .discord-tag { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); }

  /* ── Points ── */
  .pts {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 18px;
    font-weight: 500;
    color: var(--white);
  }

  /* ── Rank badge ── */
  .rank-badge {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 4px 12px;
    font-size: 12px;
    font-weight: 700;
    letter-spacing: .5px;
    border: 1px solid;
    clip-path: polygon(0 0, calc(100% - 6px) 0, 100% 6px, 100% 100%, 6px 100%, 0 calc(100% - 6px));
  }

  .rank-Стажёр  { color: var(--muted);  border-color: var(--muted);  }
  .rank-Рекрут  { color: var(--text);   border-color: var(--border); }
  .rank-Агент   { color: var(--amber);  border-color: var(--amber);  }
  .rank-Элита   { color: var(--gold);   border-color: var(--gold);   background: rgba(233,196,106,.06); }

  /* ── Buffer bar ── */
  .buffer-wrap { min-width: 100px; }

  .buffer-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-top: 4px;
  }

  .buffer-fill {
    height: 100%;
    border-radius: 2px;
    transition: width .5s ease;
  }

  .buffer-text {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 11px;
    color: var(--muted);
  }

  /* ── Weeks dots ── */
  .weeks { display: flex; gap: 4px; }

  .week-dot {
    width: 8px; height: 8px;
    border-radius: 1px;
  }

  .week-dot.on  { background: var(--green); }
  .week-dot.off { background: var(--border); }

  /* ── Status dot ── */
  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
    flex-shrink: 0;
  }

  .s-active  { background: var(--green); box-shadow: 0 0 6px var(--green); }
  .s-warning { background: var(--amber); box-shadow: 0 0 6px var(--amber); }
  .s-danger  { background: var(--red);   box-shadow: 0 0 6px var(--red);   }
  .s-kicked  { background: var(--muted); }

  /* ── Top row highlight ── */
  tbody tr:first-child td {
    background: rgba(233,196,106,.025);
  }

  /* ── Empty state ── */
  .empty {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
  }

  .empty .big { font-size: 48px; margin-bottom: 12px; }
  .empty p { font-size: 14px; letter-spacing: .5px; }

  /* ── Stats row ── */
  .stats-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
    margin-bottom: 32px;
    animation: fadeUp .5s .1s ease both;
  }

  .stat-card {
    background: var(--card);
    border: 1px solid var(--border);
    padding: 16px 20px;
    clip-path: polygon(0 0, calc(100% - 10px) 0, 100% 10px, 100% 100%, 10px 100%, 0 calc(100% - 10px));
  }

  .stat-label {
    font-family: 'IBM Plex Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .stat-value {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 2px;
    color: var(--white);
  }

  .stat-value.red  { color: var(--red);  }
  .stat-value.gold { color: var(--gold); }

  /* ── Animations ── */
  @keyframes fadeDown { from { opacity:0; transform: translateY(-20px); } to { opacity:1; transform: none; } }
  @keyframes fadeUp   { from { opacity:0; transform: translateY(16px);  } to { opacity:1; transform: none; } }
  @keyframes fadeRow  { from { opacity:0; transform: translateX(-10px); } to { opacity:1; transform: none; } }

  /* Mobile */
  @media (max-width: 680px) {
    td.hide-sm, th.hide-sm { display: none; }
    td { padding: 12px 10px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">
      <div class="logo-icon">☠</div>
      <div>
        <h1>РЕЙТИНГ <span>РЕКРУТОВ</span></h1>
        <div style="font-family:'IBM Plex Mono',monospace;font-size:11px;color:var(--muted);letter-spacing:2px;margin-top:4px;">INTERNAL · CLASSIFIED</div>
      </div>
    </div>
    <div class="meta">
      <span>ОБНОВЛЕНО: <strong id="updateTime">—</strong></span>
      <span>СЕЗОН: <strong id="season">—</strong></span>
      <span>СЛЕДУЮЩЕЕ СПИСАНИЕ: <strong id="nextBurn">ПН 12:00</strong></span>
    </div>
  </header>

  <div class="stats-row" id="statsRow">
    <div class="stat-card">
      <div class="stat-label">Всего рекрутов</div>
      <div class="stat-value" id="statTotal">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Активных</div>
      <div class="stat-value" id="statActive">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">В опасности</div>
      <div class="stat-value red" id="statDanger">—</div>
    </div>
    <div class="stat-card">
      <div class="stat-label">Топ — баллы</div>
      <div class="stat-value gold" id="statTop">—</div>
    </div>
  </div>

  <div class="toolbar">
    <button class="filter-btn active" onclick="setFilter('all', this)">ВСЕ</button>
    <button class="filter-btn" onclick="setFilter('active', this)">АКТИВНЫЕ</button>
    <button class="filter-btn" onclick="setFilter('warning', this)">ПРЕДУПРЕЖДЕНИЕ</button>
    <button class="filter-btn" onclick="setFilter('danger', this)">ОПАСНОСТЬ</button>
    <div class="spacer"></div>
    <span class="update-info" id="refreshInfo">Обновление каждые 30с</span>
  </div>

  <div class="table-wrap">
    <table>
      <thead>
        <tr>
          <th onclick="sortBy('_pos')" class="sorted" id="th-_pos">#</th>
          <th>РЕКРУТ</th>
          <th onclick="sortBy('points')" id="th-points">БАЛЛЫ</th>
          <th onclick="sortBy('rank')" id="th-rank" class="hide-sm">РАНГ</th>
          <th class="hide-sm">БУФЕР</th>
          <th class="hide-sm">НЕДЕЛИ</th>
          <th>СТАТУС</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="7"><div class="empty"><div class="big">⏳</div><p>ЗАГРУЗКА ДАННЫХ...</p></div></td></tr>
      </tbody>
    </table>
  </div>
</div>

<script>
let allData = [];
let filter = 'all';
let sortKey = '_pos';
let sortAsc = false;
let config = {};

const RANK_ORDER = { 'Стажёр': 0, 'Рекрут': 1, 'Агент': 2, 'Элита': 3 };
const MEDALS = ['🥇','🥈','🥉'];

async function fetchData() {
  try {
    const res = await fetch('/api/leaderboard');
    const json = await res.json();
    allData = (json.recruiters || []).map((r, i) => ({ ...r, _pos: i }));
    config = json.config || {};
    document.getElementById('updateTime').textContent = new Date().toLocaleTimeString('ru');
    document.getElementById('season').textContent = new Date().toLocaleDateString('ru', { month: 'long', year: 'numeric' }).toUpperCase();
    updateStats();
    render();
  } catch {
    document.getElementById('refreshInfo').textContent = '⚠ Ошибка загрузки';
  }
}

function updateStats() {
  const active = allData.filter(r => r.status === 'active').length;
  const danger = allData.filter(r => r.status === 'danger' || r.status === 'warning').length;
  const top = allData[0]?.points ?? 0;
  document.getElementById('statTotal').textContent = allData.length;
  document.getElementById('statActive').textContent = active;
  document.getElementById('statDanger').textContent = danger;
  document.getElementById('statTop').textContent = top;
}

function setFilter(f, btn) {
  filter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  render();
}

function sortBy(key) {
  if (sortKey === key) sortAsc = !sortAsc;
  else { sortKey = key; sortAsc = false; }
  document.querySelectorAll('th[id^="th-"]').forEach(th => {
    th.classList.remove('sorted','asc');
  });
  const el = document.getElementById('th-' + key);
  if (el) { el.classList.add('sorted'); if (sortAsc) el.classList.add('asc'); }
  render();
}

function getFiltered() {
  let d = allData.slice();
  if (filter !== 'all') d = d.filter(r => r.status === filter);
  d.sort((a, b) => {
    let va = a[sortKey], vb = b[sortKey];
    if (sortKey === 'rank') { va = RANK_ORDER[a.rank?.name] ?? 0; vb = RANK_ORDER[b.rank?.name] ?? 0; }
    if (typeof va === 'string') return sortAsc ? va.localeCompare(vb) : vb.localeCompare(va);
    return sortAsc ? va - vb : vb - va;
  });
  return d;
}

function bufferColor(pts) {
  if (pts <= 5)  return '#e63946';
  if (pts <= 10) return '#f4a261';
  if (pts <= 20) return '#e9c46a';
  return '#2ec27e';
}

function render() {
  const data = getFiltered();
  const tbody = document.getElementById('tbody');

  if (data.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7"><div class="empty"><div class="big">📋</div><p>НЕТ ДАННЫХ ДЛЯ ОТОБРАЖЕНИЯ</p></div></td></tr>`;
    return;
  }

  // Max points for buffer bar
  const maxPts = Math.max(...allData.map(r => r.points), 1);

  tbody.innerHTML = data.map((r, idx) => {
    const pos = idx + 1;
    const posLabel = MEDALS[pos - 1] ?? `${pos}`;
    const posClass = pos <= 3 ? `pos-${pos}` : '';

    const initials = (r.displayName || r.username || '?').slice(0, 2).toUpperCase();
    const rank = r.rank || { name: 'Стажёр', emoji: '🔰' };
    const pct = Math.min(100, (r.points / maxPts) * 100);
    const bColor = bufferColor(r.points);

    const weeks = Array.from({ length: 4 }, (_, i) => {
      const on = (r.weeklyActivity || [])[i];
      return `<div class="week-dot ${on ? 'on' : 'off'}" title="${on ? 'Активен' : 'Неактивен'}"></div>`;
    }).join('');

    const statusMap = {
      active:  ['s-active',  'АКТИВЕН'],
      warning: ['s-warning', 'ПРЕДУПР'],
      danger:  ['s-danger',  'ОПАСНОСТЬ'],
      kicked:  ['s-kicked',  'УДАЛЁН'],
    };
    const [sCls, sLabel] = statusMap[r.status] || ['s-kicked', '—'];

    return `
    <tr style="animation-delay:${idx * 40}ms">
      <td class="pos ${posClass}">${posLabel}</td>
      <td>
        <div class="recruiter-name">
          <div class="avatar">${initials}</div>
          <div class="name-block">
            <span class="display-name">${esc(r.displayName || r.username)}</span>
            <span class="discord-tag">${esc(r.username)}</span>
          </div>
        </div>
      </td>
      <td class="pts">${r.points}</td>
      <td class="hide-sm"><span class="rank-badge rank-${rank.name}">${rank.emoji} ${rank.name}</span></td>
      <td class="hide-sm">
        <div class="buffer-wrap">
          <div class="buffer-text">${r.points} / ${maxPts}</div>
          <div class="buffer-bar"><div class="buffer-fill" style="width:${pct}%;background:${bColor}"></div></div>
        </div>
      </td>
      <td class="hide-sm"><div class="weeks">${weeks}</div></td>
      <td><span class="status-dot ${sCls}"></span>${sLabel}</td>
    </tr>`;
  }).join('');
}

function esc(str) {
  return String(str || '').replace(/[<>&"]/g, c => ({ '<':'&lt;', '>':'&gt;', '&':'&amp;', '"':'&quot;' }[c]));
}

// Initial load + polling
fetchData();
setInterval(fetchData, 30000);
</script>
</body>
</html>
