<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Рейтинг рекрутов</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --gold: #C9A84C;
      --gold-dim: rgba(201,168,76,0.12);
      --gold-border: rgba(201,168,76,0.35);
      --red: #E24B4A;
      --green: #1D9E75;
      --bg: #0e0e10;
      --bg2: #151518;
      --bg3: #1c1c20;
      --border: rgba(255,255,255,0.07);
      --text: #e8e6e1;
      --muted: #888780;
      --silver: #9BA3AF;
      --bronze: #C4845C;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
    }

    /* Noise texture overlay */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none; z-index: 0;
    }

    .wrap { max-width: 1000px; margin: 0 auto; padding: 2rem 1.5rem 4rem; position: relative; z-index: 1; }

    /* Header */
    .header { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 2.5rem; flex-wrap: wrap; gap: 1rem; }
    .header-left {}
    .eyebrow { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--gold); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 6px; }
    .title { font-family: 'Bebas Neue', sans-serif; font-size: clamp(36px, 6vw, 56px); letter-spacing: 0.02em; color: var(--text); line-height: 1; }
    .title span { color: var(--gold); }
    .live-badge {
      display: flex; align-items: center; gap: 6px;
      font-size: 11px; font-family: 'IBM Plex Mono', monospace;
      color: var(--green); background: rgba(29,158,117,0.1);
      border: 1px solid rgba(29,158,117,0.25);
      padding: 5px 12px; border-radius: 99px; letter-spacing: 0.06em;
    }
    .live-dot { width: 6px; height: 6px; background: var(--green); border-radius: 50%; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.3} }

    /* Stats row */
    .stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 10px; margin-bottom: 1.75rem; }
    .stat {
      background: var(--bg2); border: 1px solid var(--border); border-radius: 10px;
      padding: 14px 16px;
    }
    .stat-label { font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-bottom: 6px; }
    .stat-val { font-size: 26px; font-weight: 600; color: var(--text); line-height: 1; }
    .stat-sub { font-size: 11px; color: var(--muted); margin-top: 4px; }

    /* Filters */
    .filters { display: flex; gap: 6px; margin-bottom: 1.25rem; flex-wrap: wrap; }
    .f-btn {
      font-size: 12px; font-weight: 500; padding: 6px 14px;
      border-radius: 99px; border: 1px solid var(--border);
      background: transparent; color: var(--muted); cursor: pointer;
      transition: all 0.15s; font-family: inherit;
    }
    .f-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text); }
    .f-btn.active { background: var(--gold-dim); border-color: var(--gold-border); color: var(--gold); }

    /* Table */
    .table-wrap {
      border: 1px solid var(--border); border-radius: 12px; overflow: hidden;
    }
    table { width: 100%; border-collapse: collapse; }
    thead tr { background: var(--bg2); }
    th {
      font-family: 'IBM Plex Mono', monospace; font-size: 10px; color: var(--muted);
      text-transform: uppercase; letter-spacing: 0.08em;
      padding: 12px 16px; text-align: left; white-space: nowrap;
      border-bottom: 1px solid var(--border); cursor: pointer; user-select: none;
    }
    th:hover { color: var(--text); }
    td { padding: 13px 16px; border-bottom: 1px solid var(--border); vertical-align: middle; }
    tbody tr:last-child td { border-bottom: none; }
    tbody tr { background: var(--bg); transition: background 0.12s; }
    tbody tr:hover td { background: var(--bg2); }

    /* Rank number */
    .rn { font-family: 'IBM Plex Mono', monospace; font-size: 13px; color: var(--muted); min-width: 28px; display: inline-block; }
    .top1 .rn { color: var(--gold); }
    .top2 .rn { color: var(--silver); }
    .top3 .rn { color: var(--bronze); }

    /* Name cell */
    .name-cell .name { font-weight: 600; font-size: 14px; color: var(--text); }
    .name-cell .tag { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); margin-top: 1px; }

    /* Rank badge */
    .rbadge { display: inline-block; font-size: 10px; font-weight: 600; padding: 2px 9px; border-radius: 99px; letter-spacing: 0.04em; white-space: nowrap; }
    .rb-elite    { background: var(--gold-dim); color: var(--gold); border: 1px solid var(--gold-border); }
    .rb-agent    { background: rgba(29,158,117,0.1); color: #3ECFA0; border: 1px solid rgba(29,158,117,0.25); }
    .rb-recruit  { background: rgba(255,255,255,0.04); color: var(--muted); border: 1px solid var(--border); }
    .rb-trainee  { background: rgba(226,75,74,0.08); color: #E27A79; border: 1px solid rgba(226,75,74,0.2); }

    /* Points */
    .pts { font-family: 'IBM Plex Mono', monospace; font-weight: 500; font-size: 14px; }

    /* Buffer */
    .buf-cell { display: flex; align-items: center; gap: 10px; min-width: 120px; }
    .buf-track { flex: 1; height: 4px; background: rgba(255,255,255,0.08); border-radius: 99px; overflow: hidden; }
    .buf-fill { height: 100%; border-radius: 99px; transition: width 0.5s ease; }
    .buf-high { background: var(--green); }
    .buf-mid  { background: var(--gold); }
    .buf-low  { background: var(--red); }
    .buf-num { font-family: 'IBM Plex Mono', monospace; font-size: 11px; color: var(--muted); min-width: 28px; text-align: right; }

    /* Weeks dots */
    .dots { display: flex; gap: 3px; align-items: center; }
    .dot { width: 7px; height: 7px; border-radius: 50%; }
    .d-ok  { background: var(--green); }
    .d-miss{ background: rgba(255,255,255,0.1); }
    .d-cur { background: var(--gold); }

    /* Status */
    .sbadge { font-size: 10px; font-weight: 600; padding: 2px 9px; border-radius: 99px; white-space: nowrap; letter-spacing: 0.03em; }
    .s-active   { background: rgba(29,158,117,0.1); color: #3ECFA0; }
    .s-warn     { background: rgba(201,168,76,0.1); color: var(--gold); }
    .s-inactive { background: rgba(226,75,74,0.08); color: #E27A79; }

    /* Sort indicator */
    .si { font-size: 9px; margin-left: 3px; opacity: 0.5; }

    /* Footer note */
    .footnote { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
    .legend { display: flex; gap: 14px; flex-wrap: wrap; }
    .leg-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }

    /* Loading / empty */
    .empty { text-align: center; padding: 3rem; color: var(--muted); font-size: 14px; }

    /* Responsive */
    @media (max-width: 640px) {
      .col-week, .col-accepted { display: none; }
    }
  </style>
</head>
<body>
<div class="wrap">

  <header class="header">
    <div class="header-left">
      <div class="eyebrow" id="season-label">Загрузка...</div>
      <h1 class="title">РЕЙТИНГ <span>РЕКРУТОВ</span></h1>
    </div>
    <div class="live-badge"><div class="live-dot"></div>LIVE</div>
  </header>

  <div class="stats" id="stats">
    <div class="stat"><div class="stat-label">Рекрутов</div><div class="stat-val">—</div></div>
    <div class="stat"><div class="stat-label">Принято всего</div><div class="stat-val">—</div></div>
    <div class="stat"><div class="stat-label">Отклонено</div><div class="stat-val">—</div></div>
    <div class="stat"><div class="stat-label">На грани</div><div class="stat-val" style="color:var(--red)">—</div></div>
  </div>

  <div class="filters">
    <button class="f-btn active" onclick="setFilter('all',this)">Все</button>
    <button class="f-btn" onclick="setFilter('active',this)">Активные</button>
    <button class="f-btn" onclick="setFilter('warn',this)">На грани</button>
    <button class="f-btn" onclick="setFilter('inactive',this)">Неактивные</button>
  </div>

  <div class="table-wrap">
    <table>
      <colgroup>
        <col style="width:48px">
        <col style="width:28%">
        <col style="width:14%">
        <col style="width:10%">
        <col style="width:22%">
        <col class="col-accepted" style="width:12%">
        <col style="width:14%">
      </colgroup>
      <thead>
        <tr>
          <th onclick="sortBy('rank')">#<span class="si" id="si-rank"></span></th>
          <th onclick="sortBy('name')">Рекрут<span class="si" id="si-name"></span></th>
          <th>Ранг</th>
          <th onclick="sortBy('points')">Очки<span class="si" id="si-points">▼</span></th>
          <th onclick="sortBy('buffer_pts')">Буфер<span class="si" id="si-buffer_pts"></span></th>
          <th class="col-accepted" onclick="sortBy('total_accepted')">Принято<span class="si" id="si-total_accepted"></span></th>
          <th>Статус</th>
        </tr>
      </thead>
      <tbody id="tbody">
        <tr><td colspan="7" class="empty">Загрузка данных...</td></tr>
      </tbody>
    </table>
  </div>

  <div class="footnote">
    <div class="legend">
      <div class="leg-item"><div class="dot d-ok"></div> выполнено</div>
      <div class="leg-item"><div class="dot d-cur"></div> текущая</div>
      <div class="leg-item"><div class="dot d-miss"></div> пропущено</div>
    </div>
    <div style="font-size:11px; color:var(--muted);">
      Буфер: −5/нед · макс 40 · при 0 → исключение
    </div>
  </div>

</div>

<script>
  const MAX_BUF = 40;
  let allData = [];
  let currentFilter = 'all';
  let sortKey = 'points';
  let sortDir = -1;

  const RANKS = [
    { min: 80, label: 'Элита',  cls: 'rb-elite'   },
    { min: 45, label: 'Агент',  cls: 'rb-agent'   },
    { min: 15, label: 'Рекрут', cls: 'rb-recruit' },
    { min: 0,  label: 'Стажёр', cls: 'rb-trainee' },
  ];

  function getRank(pts) { return RANKS.find(r => pts >= r.min) || RANKS[3]; }

  function bufClass(buf) {
    const p = buf / MAX_BUF;
    return p > 0.5 ? 'buf-high' : p > 0.2 ? 'buf-mid' : 'buf-low';
  }

  function statusCls(s) {
    return { active: 's-active', warn: 's-warn', inactive: 's-inactive' }[s] || 's-inactive';
  }
  function statusLabel(s) {
    return { active: 'Активен', warn: 'Под угрозой', inactive: 'Неактивен' }[s] || s;
  }

  // Fake weekly dots based on last activity (visual only)
  function weekDots(row) {
    const pts = row.points;
    const arr = pts > 60 ? [1,1,1,2,0] : pts > 30 ? [1,1,2,0,0] : pts > 10 ? [1,2,0,0,0] : [0,0,0,0,2];
    return arr.map(v => `<div class="dot ${v===1?'d-ok':v===2?'d-cur':'d-miss'}"></div>`).join('');
  }

  function render() {
    let data = [...allData];
    if (currentFilter !== 'all') data = data.filter(r => r.status === currentFilter);

    data.sort((a, b) => {
      if (sortKey === 'name') return sortDir * a.username.localeCompare(b.username);
      const av = parseFloat(a[sortKey]) || 0;
      const bv = parseFloat(b[sortKey]) || 0;
      return sortDir * (av - bv);
    });

    const tbody = document.getElementById('tbody');
    if (!data.length) {
      tbody.innerHTML = `<tr><td colspan="7" class="empty">Нет данных по выбранному фильтру</td></tr>`;
      return;
    }

    // Global rank by points for top 1-2-3 coloring
    const ranked = [...allData].sort((a,b) => b.points - a.points);

    tbody.innerHTML = data.map(row => {
      const globalRank = ranked.findIndex(r => r.discord_id === row.discord_id) + 1;
      const topCls = globalRank === 1 ? 'top1' : globalRank === 2 ? 'top2' : globalRank === 3 ? 'top3' : '';
      const rnLabel = globalRank === 1 ? '①' : globalRank === 2 ? '②' : globalRank === 3 ? '③' : globalRank;
      const rank = getRank(+row.points);
      const pct = Math.round((+row.buffer_pts / MAX_BUF) * 100);
      return `
        <tr class="${topCls}">
          <td><span class="rn">${rnLabel}</span></td>
          <td class="name-cell">
            <div class="name">${row.username}</div>
            <div class="tag">#${row.discord_id.slice(-4)}</div>
          </td>
          <td><span class="rbadge ${rank.cls}">${rank.label}</span></td>
          <td><span class="pts">${row.points}</span></td>
          <td>
            <div class="buf-cell">
              <div class="buf-track"><div class="buf-fill ${bufClass(+row.buffer_pts)}" style="width:${pct}%"></div></div>
              <span class="buf-num">${row.buffer_pts}</span>
            </div>
          </td>
          <td class="col-accepted" style="font-family:'IBM Plex Mono',monospace;font-size:13px;">${row.total_accepted}</td>
          <td><span class="sbadge ${statusCls(row.status)}">${statusLabel(row.status)}</span></td>
        </tr>`;
    }).join('');
  }

  function setFilter(val, btn) {
    currentFilter = val;
    document.querySelectorAll('.f-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    render();
  }

  function sortBy(key) {
    if (sortKey === key) sortDir *= -1;
    else { sortKey = key; sortDir = -1; }
    document.querySelectorAll('[id^="si-"]').forEach(el => el.textContent = '');
    const el = document.getElementById('si-' + key);
    if (el) el.textContent = sortDir === -1 ? '▼' : '▲';
    render();
  }

  async function loadStats() {
    try {
      const r = await fetch('/api/stats');
      const s = await r.json();
      const now = new Date();
      document.getElementById('season-label').textContent =
        `Сезон · ${now.toLocaleString('ru-RU',{month:'long',year:'numeric'})}`;
      document.getElementById('stats').innerHTML = `
        <div class="stat"><div class="stat-label">Рекрутов</div><div class="stat-val">${s.total_recruiters}</div><div class="stat-sub">в системе</div></div>
        <div class="stat"><div class="stat-label">Принято</div><div class="stat-val">${s.total_accepted}</div><div class="stat-sub">кандидатов</div></div>
        <div class="stat"><div class="stat-label">Отклонено</div><div class="stat-val">${s.total_rejected}</div><div class="stat-sub">выявлено нарушений</div></div>
        <div class="stat"><div class="stat-label">На грани</div><div class="stat-val" style="color:var(--red)">${s.at_risk}</div><div class="stat-sub">буфер = 0</div></div>
      `;
    } catch(e) { console.error('stats error', e); }
  }

  async function loadLeaderboard() {
    try {
      const r = await fetch('/api/leaderboard');
      allData = await r.json();
      render();
    } catch(e) {
      document.getElementById('tbody').innerHTML = `<tr><td colspan="7" class="empty">Ошибка загрузки данных</td></tr>`;
    }
  }

  // Initial load
  loadStats();
  loadLeaderboard();

  // Auto-refresh every 30 seconds
  setInterval(() => { loadStats(); loadLeaderboard(); }, 30000);
</script>
</body>
</html>
