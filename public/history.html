<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>История баллов</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Rajdhani:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet"/>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  :root{
    --bg:#050508;--surface:#0d0d14;--card:#11111a;--border:#1e1e2e;
    --red:#e63946;--gold:#e9c46a;--green:#2ec27e;--blue:#60a5fa;
    --muted:#555570;--text:#d8d8e8;--dim:#888899;--white:#f0f0fa;
  }
  body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;overflow-x:hidden}
  a{color:var(--blue);text-decoration:none}
  header{border-bottom:1px solid var(--border);padding:18px 32px;display:flex;align-items:center;gap:20px}
  .header-title{font-family:'Bebas Neue';font-size:26px;letter-spacing:2px;color:var(--white)}
  .header-sub{font-size:13px;color:var(--muted)}
  .back-btn{font-family:'IBM Plex Mono';font-size:12px;color:var(--muted);border:1px solid var(--border);padding:6px 12px;cursor:pointer;background:none;letter-spacing:1px}
  .back-btn:hover{color:var(--text);border-color:var(--dim)}

  main{max-width:1100px;margin:0 auto;padding:32px 24px}

  .filters{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:28px;align-items:flex-end}
  .filter-group{display:flex;flex-direction:column;gap:6px}
  .filter-label{font-size: 13px;color:var(--muted);text-transform:uppercase;letter-spacing:1.2px;font-family:'IBM Plex Mono'}
  .filter-input{background:var(--card);border:1px solid var(--border);color:var(--text);padding:8px 12px;font-family:'Rajdhani';font-size:14px;outline:none;min-width:180px}
  .filter-input:focus{border-color:var(--blue)}
  .btn{padding:9px 20px;font-family:'Rajdhani';font-weight:700;font-size:14px;letter-spacing:1px;cursor:pointer;border:none;text-transform:uppercase}
  .btn-primary{background:var(--blue);color:#000}
  .btn-ghost{background:none;border:1px solid var(--border);color:var(--dim)}
  .btn-ghost:hover{border-color:var(--dim);color:var(--text)}

  .summary{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:24px}
  .stat-card{background:var(--card);border:1px solid var(--border);padding:14px 20px;flex:1;min-width:160px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
  .stat-label{font-size: 13px;color:var(--muted);letter-spacing:1.5px;text-transform:uppercase;font-family:'IBM Plex Mono';margin-bottom:6px}
  .stat-val{font-family:'Bebas Neue';font-size:28px;letter-spacing:1px}
  .stat-val.green{color:var(--green)}
  .stat-val.red{color:var(--red)}

  table{width:100%;border-collapse:collapse}
  thead th{padding:10px 14px;font-size: 13px;text-transform:uppercase;letter-spacing:1.5px;font-family:'IBM Plex Mono';color:var(--muted);border-bottom:1px solid var(--border);text-align:left}
  tbody tr{border-bottom:1px solid rgba(30,30,46,.6);transition:background .15s}
  tbody tr:hover{background:var(--card)}
  td{padding:11px 14px;font-size:14px}
  .td-date{font-family:'IBM Plex Mono';font-size:12px;color:var(--dim);white-space:nowrap}
  .td-name{font-weight:600;color:var(--white)}
  .td-action{color:var(--muted);font-size:13px}
  .td-actor{font-family:'IBM Plex Mono';font-size: 13px;color:var(--dim)}
  .delta-pos{color:var(--green);font-family:'IBM Plex Mono';font-weight:600}
  .delta-neg{color:var(--red);font-family:'IBM Plex Mono';font-weight:600}

  .pagination{display:flex;gap:10px;align-items:center;margin-top:24px;justify-content:center;flex-wrap:wrap}
  .page-btn{background:var(--card);border:1px solid var(--border);color:var(--dim);padding:7px 16px;font-family:'IBM Plex Mono';font-size:12px;cursor:pointer}
  .page-btn:hover:not(:disabled){border-color:var(--blue);color:var(--blue)}
  .page-btn:disabled{opacity:.35;cursor:not-allowed}
  .page-info{font-size:13px;color:var(--muted)}

  .empty{text-align:center;padding:60px 20px;color:var(--muted);font-size:15px}
  #loading{text-align:center;padding:60px 20px;color:var(--muted);font-family:'IBM Plex Mono';font-size:13px;letter-spacing:1px}
  .auth-wall{text-align:center;padding:80px 20px}
  .auth-wall h2{font-family:'Bebas Neue';font-size:32px;margin-bottom:12px;color:var(--red)}
</style>
</head>
<body>

<header>
  <button class="back-btn" onclick="history.back()">← НАЗАД</button>
  <div>
    <div class="header-title">📊 ИСТОРИЯ БАЛЛОВ</div>
    <div class="header-sub">Полный журнал начислений и списаний</div>
  </div>
</header>

<main>
  <div id="authWall" class="auth-wall" style="display:none">
    <h2>🔒 ДОСТУП ЗАПРЕЩЁН</h2>
    <p style="color:var(--muted);margin-bottom:20px">Страница доступна только администраторам</p>
    <a href="/index.html" style="color:var(--blue)">← На главную</a>
  </div>

  <div id="app">
    <div class="filters">
      <div class="filter-group">
        <div class="filter-label">Рекрут (Discord ID)</div>
        <input class="filter-input" id="fUserId" placeholder="Все рекруты" style="min-width:220px">
      </div>
      <div class="filter-group">
        <div class="filter-label">Дата от</div>
        <input class="filter-input" id="fDateFrom" type="date">
      </div>
      <div class="filter-group">
        <div class="filter-label">Дата до</div>
        <input class="filter-input" id="fDateTo" type="date">
      </div>
      <div class="filter-group">
        <div class="filter-label">&nbsp;</div>
        <button class="btn btn-primary" onclick="applyFilters()">🔍 ПРИМЕНИТЬ</button>
      </div>
      <div class="filter-group">
        <div class="filter-label">&nbsp;</div>
        <button class="btn btn-ghost" onclick="resetFilters()">✕ СБРОС</button>
      </div>
    </div>

    <div class="summary" id="summary" style="display:none">
      <div class="stat-card">
        <div class="stat-label">Всего записей</div>
        <div class="stat-val" id="sTotal">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Начислено</div>
        <div class="stat-val green" id="sEarned">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Списано</div>
        <div class="stat-val red" id="sLost">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Баланс</div>
        <div class="stat-val" id="sNet">—</div>
      </div>
    </div>

    <div id="loading">ЗАГРУЗКА...</div>

    <div id="tableWrap" style="display:none">
      <table>
        <thead>
          <tr>
            <th>Дата</th>
            <th>Рекрут</th>
            <th>Действие</th>
            <th>Δ Баллы</th>
            <th>Кто</th>
          </tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="empty" id="emptyMsg" style="display:none">Записей не найдено</div>
    </div>

    <div class="pagination" id="paginationEl" style="display:none">
      <button class="page-btn" id="btnPrev" onclick="prevPage()">← ПРЕД</button>
      <span class="page-info" id="pageInfo"></span>
      <button class="page-btn" id="btnNext" onclick="nextPage()">СЛЕД →</button>
    </div>
  </div>
</main>

<script>
const LIMIT = 100;
let authToken = null;
let currentOffset = 0;
let currentTotal  = 0;
let currentFilters = {};

// ── Auth ──────────────────────────────────────────────────
async function init() {
  authToken = localStorage.getItem('authToken');
  if (!authToken) { showAuthWall(); return; }

  // Check role
  try {
    const r = await fetch('/api/auth/me', { headers: { 'x-token': authToken } });
    if (!r.ok) { showAuthWall(); return; }
    const me = await r.json();
    if (me.role !== 'admin') { showAuthWall(); return; }
  } catch { showAuthWall(); return; }

  loadHistory();
}

function showAuthWall() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('authWall').style.display = 'block';
}

// ── Data ──────────────────────────────────────────────────
async function loadHistory() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('tableWrap').style.display = 'none';
  document.getElementById('paginationEl').style.display = 'none';
  document.getElementById('summary').style.display = 'none';

  const params = new URLSearchParams({ limit: LIMIT, offset: currentOffset });
  if (currentFilters.userId)   params.set('userId',   currentFilters.userId);
  if (currentFilters.dateFrom) params.set('dateFrom', currentFilters.dateFrom + 'T00:00:00.000Z');
  if (currentFilters.dateTo)   params.set('dateTo',   currentFilters.dateTo   + 'T23:59:59.999Z');

  try {
    const r = await fetch('/api/history?' + params.toString(), { headers: { 'x-token': authToken } });
    if (r.status === 401 || r.status === 403) { showAuthWall(); return; }
    const data = await r.json();
    currentTotal = data.total || 0;
    renderTable(data.rows || []);
  } catch {
    document.getElementById('loading').textContent = 'Ошибка загрузки данных';
  }
}

function renderTable(rows) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('tableWrap').style.display = 'block';

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  if (!rows.length) {
    document.getElementById('emptyMsg').style.display = 'block';
  } else {
    document.getElementById('emptyMsg').style.display = 'none';

    let earned = 0, lost = 0;
    for (const row of rows) {
      if (row.delta > 0) earned += row.delta; else lost += Math.abs(row.delta);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="td-date">${formatDate(row.date)}</td>
        <td class="td-name">${esc(row.displayName || row.user_id)}<br><span style="font-family:'IBM Plex Mono';font-size: 13px;color:var(--dim)">${esc(row.user_id)}</span></td>
        <td class="td-action">${esc(row.action)}</td>
        <td class="${row.delta >= 0 ? 'delta-pos' : 'delta-neg'}">${row.delta >= 0 ? '+' : ''}${row.delta}</td>
        <td class="td-actor">${esc(row.actorId || '—')}</td>
      `;
      tbody.appendChild(tr);
    }

    const net = earned - lost;
    document.getElementById('sTotal').textContent  = currentTotal.toLocaleString('ru');
    document.getElementById('sEarned').textContent = '+' + earned;
    document.getElementById('sLost').textContent   = '-' + lost;
    document.getElementById('sNet').textContent    = (net >= 0 ? '+' : '') + net;
    document.getElementById('sNet').className      = 'stat-val ' + (net >= 0 ? 'green' : 'red');
    document.getElementById('summary').style.display = 'flex';
  }

  // Pagination
  const totalPages = Math.ceil(currentTotal / LIMIT);
  const curPage    = Math.floor(currentOffset / LIMIT) + 1;
  if (totalPages > 1) {
    document.getElementById('pageInfo').textContent = `Стр. ${curPage} / ${totalPages} · Всего ${currentTotal.toLocaleString('ru')}`;
    document.getElementById('btnPrev').disabled = currentOffset === 0;
    document.getElementById('btnNext').disabled = currentOffset + LIMIT >= currentTotal;
    document.getElementById('paginationEl').style.display = 'flex';
  }
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('ru') + ' ' + d.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
}
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

// ── Filters ───────────────────────────────────────────────
function applyFilters() {
  currentFilters = {
    userId:   document.getElementById('fUserId').value.trim()   || undefined,
    dateFrom: document.getElementById('fDateFrom').value        || undefined,
    dateTo:   document.getElementById('fDateTo').value          || undefined,
  };
  currentOffset = 0;
  loadHistory();
}

function resetFilters() {
  document.getElementById('fUserId').value = '';
  document.getElementById('fDateFrom').value = '';
  document.getElementById('fDateTo').value = '';
  currentFilters = {};
  currentOffset = 0;
  loadHistory();
}

// ── Pagination ────────────────────────────────────────────
function prevPage() { if (currentOffset > 0) { currentOffset -= LIMIT; loadHistory(); } }
function nextPage() { if (currentOffset + LIMIT < currentTotal) { currentOffset += LIMIT; loadHistory(); } }

init();
</script>
</body>
</html>
