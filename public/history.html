<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>История баллов</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:           #050507;
    --bg-elevated:  #0a0a0e;
    --surface:      #0f0f15;
    --card:         #12121b;
    --border:       #1a1a22;
    --border-mid:   #25252e;
    --border-strong:#35353f;

    --red:          #ff4d5f;
    --gold:         #f5c542;
    --amber:        #f4a261;
    --green:        #2ec27e;
    --blue:         #7dadff;
    --purple:       #b39bff;
    --gold-soft:    rgba(245,197,66,0.08);
    --gold-edge:    rgba(245,197,66,0.35);
    --gold-glow:    rgba(245,197,66,0.4);

    --text:         #e8e8f0;
    --white:        #f5f5fa;
    --dim:          #888899;
    --muted:        #5a5a6a;
  }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Space Grotesk', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
    letter-spacing: -0.005em;
  }
  body::before {
    content: '';
    position: fixed; inset: 0;
    background-image:
      linear-gradient(rgba(255,255,255,0.018) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,255,255,0.018) 1px, transparent 1px);
    background-size: 32px 32px;
    mask-image: radial-gradient(ellipse 80% 60% at 50% 30%, black 40%, transparent 90%);
    pointer-events: none; z-index: 0;
  }
  body::after {
    content: '';
    position: fixed; inset: 0;
    background:
      radial-gradient(circle at 15% 0%, var(--gold-soft), transparent 50%),
      radial-gradient(circle at 85% 100%, rgba(245,197,66,0.04), transparent 50%);
    pointer-events: none; z-index: 0;
  }

  a { color: var(--gold); text-decoration: none; transition: opacity .15s; }
  a:hover { opacity: .8; }

  header {
    position: relative; z-index: 1;
    border-bottom: 1px solid var(--border);
    padding: 22px 32px;
    display: flex; align-items: center; gap: 24px;
    flex-wrap: wrap;
  }
  .header-icon {
    width: 44px; height: 44px;
    background: linear-gradient(135deg, var(--gold) 0%, #c9a430 100%);
    display: grid; place-items: center;
    font-size: 18px;
    border-radius: 10px;
    box-shadow:
      0 4px 18px var(--gold-glow),
      0 0 0 1px rgba(255,255,255,0.08) inset;
    color: #1a1a22;
  }
  .header-title {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 26px;
    color: var(--white);
    letter-spacing: -0.02em;
    line-height: 1;
  }
  .header-sub {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1.2px;
    text-transform: uppercase;
    margin-top: 4px;
  }
  .back-btn {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    border: 1px solid var(--border);
    padding: 9px 14px;
    cursor: pointer;
    background: none;
    letter-spacing: 1px;
    border-radius: 8px;
    transition: .15s;
    text-transform: uppercase;
  }
  .back-btn:hover { color: var(--text); border-color: var(--border-strong); background: rgba(255,255,255,0.02); }

  main {
    max-width: 1180px;
    margin: 0 auto;
    padding: 36px 24px 80px;
    position: relative; z-index: 1;
  }

  .filters {
    display: flex; flex-wrap: wrap; gap: 14px;
    margin-bottom: 28px;
    align-items: flex-end;
    animation: fadeUp .5s ease both;
  }
  .filter-group { display: flex; flex-direction: column; gap: 8px; }
  .filter-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }
  .filter-input {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--white);
    padding: 10px 14px;
    font-family: 'Space Grotesk', sans-serif;
    font-size: 14px;
    font-weight: 500;
    outline: none;
    min-width: 180px;
    border-radius: 8px;
    transition: border-color .15s, box-shadow .15s;
  }
  .filter-input:focus {
    border-color: var(--gold-edge);
    box-shadow: 0 0 0 3px rgba(245,197,66,0.1);
  }
  .filter-input::placeholder { color: var(--muted); }

  .btn {
    padding: 10px 20px;
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 13px;
    letter-spacing: 0.3px;
    cursor: pointer;
    border: none;
    text-transform: uppercase;
    border-radius: 8px;
    transition: all .15s;
  }
  .btn-primary {
    background: var(--gold);
    color: #1a1a22;
    box-shadow: 0 4px 16px var(--gold-glow);
  }
  .btn-primary:hover { transform: translateY(-1px); box-shadow: 0 6px 20px var(--gold-glow); }
  .btn-ghost {
    background: none;
    border: 1px solid var(--border);
    color: var(--dim);
  }
  .btn-ghost:hover { border-color: var(--border-strong); color: var(--text); background: rgba(255,255,255,0.02); }

  .summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 14px;
    margin-bottom: 28px;
    animation: fadeUp .5s .1s ease both;
  }
  .stat-card {
    background: linear-gradient(180deg, var(--card) 0%, var(--bg-elevated) 100%);
    border: 1px solid var(--border);
    padding: 18px 22px;
    border-radius: 12px;
    position: relative;
    overflow: hidden;
  }
  .stat-card::before {
    content: ''; position: absolute; top: 0; left: 0; right: 0; height: 1px;
    background: linear-gradient(90deg, transparent, rgba(255,255,255,0.1), transparent);
  }
  .stat-label {
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .stat-val {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 600;
    font-size: 30px;
    letter-spacing: -0.02em;
    line-height: 1;
    color: var(--white);
  }
  .stat-val.green { color: var(--green); text-shadow: 0 0 24px rgba(46,194,126,0.3); }
  .stat-val.red { color: var(--red); text-shadow: 0 0 24px rgba(255,77,95,0.3); }

  .table-wrap-outer {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 14px;
    overflow: hidden;
    animation: fadeUp .5s .2s ease both;
  }
  table { width: 100%; border-collapse: collapse; }
  thead tr {
    background: rgba(255,255,255,0.015);
    border-bottom: 1px solid var(--border);
  }
  thead th {
    padding: 14px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    text-align: left;
    font-weight: 500;
  }
  tbody tr {
    border-bottom: 1px solid var(--border);
    transition: background .15s;
  }
  tbody tr:last-child { border-bottom: none; }
  tbody tr:hover { background: var(--gold-soft); }
  td { padding: 14px 18px; font-size: 14px; vertical-align: middle; }

  .td-date {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    white-space: nowrap;
    letter-spacing: 0.3px;
  }
  .td-name { font-weight: 600; color: var(--white); }
  .td-name .id-line {
    display: block;
    font-family: 'JetBrains Mono', monospace;
    font-size: 10px;
    color: var(--muted);
    font-weight: 400;
    margin-top: 2px;
  }
  .td-action { color: var(--text); font-size: 13px; }
  .td-actor {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--dim);
    letter-spacing: 0.3px;
  }
  .delta-pos {
    color: var(--green);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 14px;
  }
  .delta-neg {
    color: var(--red);
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 14px;
  }

  .pagination {
    display: flex; gap: 10px;
    align-items: center;
    margin-top: 24px;
    justify-content: center;
    flex-wrap: wrap;
  }
  .page-btn {
    background: var(--card);
    border: 1px solid var(--border);
    color: var(--dim);
    padding: 9px 18px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    letter-spacing: 0.5px;
    cursor: pointer;
    border-radius: 8px;
    transition: .15s;
    text-transform: uppercase;
  }
  .page-btn:hover:not(:disabled) {
    border-color: var(--gold-edge);
    color: var(--gold);
    background: var(--gold-soft);
  }
  .page-btn:disabled { opacity: .3; cursor: not-allowed; }
  .page-info {
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    color: var(--muted);
    letter-spacing: 0.3px;
  }

  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    letter-spacing: 0.3px;
  }
  #loading {
    text-align: center;
    padding: 80px 20px;
    color: var(--muted);
    font-family: 'JetBrains Mono', monospace;
    font-size: 12px;
    letter-spacing: 1.5px;
  }
  .auth-wall {
    text-align: center;
    padding: 100px 20px;
  }
  .auth-wall .icon { font-size: 64px; margin-bottom: 24px; opacity: .8; }
  .auth-wall h2 {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 30px;
    color: var(--red);
    letter-spacing: -0.02em;
    margin-bottom: 12px;
  }
  .auth-wall p {
    font-family: 'JetBrains Mono', monospace;
    font-size: 11px;
    color: var(--muted);
    letter-spacing: 1px;
    margin-bottom: 24px;
    text-transform: uppercase;
  }

  @keyframes fadeUp { from { opacity: 0; transform: translateY(16px); } to { opacity: 1; transform: none; } }

  @media (max-width: 720px) {
    header { padding: 18px 20px; }
    main { padding: 24px 16px 60px; }
    .filter-input { min-width: 140px; }
    .stat-val { font-size: 24px; }
    td, thead th { padding: 12px 12px; font-size: 13px; }
  }
</style>
</head>
<body>

<header>
  <button class="back-btn" onclick="history.back()">← НАЗАД</button>
  <div class="header-icon">📊</div>
  <div>
    <div class="header-title">История баллов</div>
    <div class="header-sub">Полный журнал начислений и списаний</div>
  </div>
</header>

<main>
  <div id="authWall" class="auth-wall" style="display:none">
    <div class="icon">🔒</div>
    <h2>ДОСТУП ЗАПРЕЩЁН</h2>
    <p>Страница доступна только администраторам</p>
    <a href="/index.html">← На главную</a>
  </div>

  <div id="app">
    <div class="filters">
      <div class="filter-group">
        <div class="filter-label">Рекрут (Discord ID)</div>
        <input class="filter-input" id="fUserId" placeholder="Все рекруты" style="min-width:220px">
      </div>
      <div class="filter-group">
        <div class="filter-label">Дата от</div>
        <input class="filter-input" id="fDateFrom" type="date">
      </div>
      <div class="filter-group">
        <div class="filter-label">Дата до</div>
        <input class="filter-input" id="fDateTo" type="date">
      </div>
      <div class="filter-group">
        <button class="btn btn-primary" onclick="applyFilters()">🔍 ПРИМЕНИТЬ</button>
      </div>
      <div class="filter-group">
        <button class="btn btn-ghost" onclick="resetFilters()">✕ СБРОС</button>
      </div>
    </div>

    <div class="summary" id="summary" style="display:none">
      <div class="stat-card">
        <div class="stat-label">Всего записей</div>
        <div class="stat-val" id="sTotal">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Начислено</div>
        <div class="stat-val green" id="sEarned">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Списано</div>
        <div class="stat-val red" id="sLost">—</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Баланс</div>
        <div class="stat-val" id="sNet">—</div>
      </div>
    </div>

    <div id="loading">ЗАГРУЗКА...</div>

    <div id="tableWrap" style="display:none">
      <div class="table-wrap-outer">
        <table>
          <thead>
            <tr>
              <th>Дата</th>
              <th>Рекрут</th>
              <th>Действие</th>
              <th>Δ Баллы</th>
              <th>Кто</th>
            </tr>
          </thead>
          <tbody id="tbody"></tbody>
        </table>
        <div class="empty" id="emptyMsg" style="display:none">Записей не найдено</div>
      </div>
    </div>

    <div class="pagination" id="paginationEl" style="display:none">
      <button class="page-btn" id="btnPrev" onclick="prevPage()">← ПРЕД</button>
      <span class="page-info" id="pageInfo"></span>
      <button class="page-btn" id="btnNext" onclick="nextPage()">СЛЕД →</button>
    </div>
  </div>
</main>

<script>
const LIMIT = 100;
let authToken = null;
let currentOffset = 0;
let currentTotal  = 0;
let currentFilters = {};

async function init() {
  authToken = localStorage.getItem('authToken');
  if (!authToken) { showAuthWall(); return; }

  try {
    const r = await fetch('/api/auth/me', { headers: { 'x-token': authToken } });
    if (!r.ok) { showAuthWall(); return; }
    const me = await r.json();
    if (me.role !== 'admin') { showAuthWall(); return; }
  } catch { showAuthWall(); return; }

  loadHistory();
}

function showAuthWall() {
  document.getElementById('app').style.display = 'none';
  document.getElementById('authWall').style.display = 'block';
}

async function loadHistory() {
  document.getElementById('loading').style.display = 'block';
  document.getElementById('tableWrap').style.display = 'none';
  document.getElementById('paginationEl').style.display = 'none';
  document.getElementById('summary').style.display = 'none';

  const params = new URLSearchParams({ limit: LIMIT, offset: currentOffset });
  if (currentFilters.userId)   params.set('userId',   currentFilters.userId);
  if (currentFilters.dateFrom) params.set('dateFrom', currentFilters.dateFrom + 'T00:00:00.000Z');
  if (currentFilters.dateTo)   params.set('dateTo',   currentFilters.dateTo   + 'T23:59:59.999Z');

  try {
    const r = await fetch('/api/history?' + params.toString(), { headers: { 'x-token': authToken } });
    if (r.status === 401 || r.status === 403) { showAuthWall(); return; }
    const data = await r.json();
    currentTotal = data.total || 0;
    renderTable(data.rows || []);
  } catch {
    document.getElementById('loading').textContent = 'Ошибка загрузки данных';
  }
}

function renderTable(rows) {
  document.getElementById('loading').style.display = 'none';
  document.getElementById('tableWrap').style.display = 'block';

  const tbody = document.getElementById('tbody');
  tbody.innerHTML = '';

  if (!rows.length) {
    document.getElementById('emptyMsg').style.display = 'block';
  } else {
    document.getElementById('emptyMsg').style.display = 'none';

    let earned = 0, lost = 0;
    for (const row of rows) {
      if (row.delta > 0) earned += row.delta; else lost += Math.abs(row.delta);
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td class="td-date">${formatDate(row.date)}</td>
        <td class="td-name">${esc(row.displayName || row.user_id)}<span class="id-line">${esc(row.user_id)}</span></td>
        <td class="td-action">${esc(row.action)}</td>
        <td class="${row.delta >= 0 ? 'delta-pos' : 'delta-neg'}">${row.delta >= 0 ? '+' : ''}${row.delta}</td>
        <td class="td-actor">${esc(row.actorId || '—')}</td>
      `;
      tbody.appendChild(tr);
    }

    const net = earned - lost;
    document.getElementById('sTotal').textContent  = currentTotal.toLocaleString('ru');
    document.getElementById('sEarned').textContent = '+' + earned;
    document.getElementById('sLost').textContent   = '-' + lost;
    document.getElementById('sNet').textContent    = (net >= 0 ? '+' : '') + net;
    document.getElementById('sNet').className      = 'stat-val ' + (net >= 0 ? 'green' : 'red');
    document.getElementById('summary').style.display = 'grid';
  }

  const totalPages = Math.ceil(currentTotal / LIMIT);
  const curPage    = Math.floor(currentOffset / LIMIT) + 1;
  if (totalPages > 1) {
    document.getElementById('pageInfo').textContent = `Стр. ${curPage} / ${totalPages} · Всего ${currentTotal.toLocaleString('ru')}`;
    document.getElementById('btnPrev').disabled = currentOffset === 0;
    document.getElementById('btnNext').disabled = currentOffset + LIMIT >= currentTotal;
    document.getElementById('paginationEl').style.display = 'flex';
  }
}

function formatDate(iso) {
  if (!iso) return '—';
  const d = new Date(iso);
  return d.toLocaleDateString('ru') + ' ' + d.toLocaleTimeString('ru', { hour: '2-digit', minute: '2-digit' });
}
function esc(s) { return String(s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function applyFilters() {
  currentFilters = {
    userId:   document.getElementById('fUserId').value.trim()   || undefined,
    dateFrom: document.getElementById('fDateFrom').value        || undefined,
    dateTo:   document.getElementById('fDateTo').value          || undefined,
  };
  currentOffset = 0;
  loadHistory();
}

function resetFilters() {
  document.getElementById('fUserId').value = '';
  document.getElementById('fDateFrom').value = '';
  document.getElementById('fDateTo').value = '';
  currentFilters = {};
  currentOffset = 0;
  loadHistory();
}

function prevPage() { if (currentOffset > 0) { currentOffset -= LIMIT; loadHistory(); } }
function nextPage() { if (currentOffset + LIMIT < currentTotal) { currentOffset += LIMIT; loadHistory(); } }

init();
</script>
</body>
</html>
